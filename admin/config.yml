# ==========================================
# 迷幻の罐罐 | Decap CMS 完整設定
# ==========================================

# ---------- 後台登入設定 ----------
backend:
  name: github
  repo: kyle20130422-hash/-
  branch: main

  # OAuth Proxy
  base_url: https://cms-auth.netlify.app
  auth_endpoint: /auth

  # GitHub Pages 網域
  site_domain: kyle20130422-hash.github.io


# ---------- 網站基本設定 ----------
site_url: https://kyle20130422-hash.github.io/-/
display_url: https://kyle20130422-hash.github.io/-/

logo:
  src: "../assets/logo.png"
  show_in_header: true

locale: zh_Hant
publish_mode: simple

# ---------- 圖片與檔案 ----------
media_folder: "assets/uploads"
public_folder: "assets/uploads"

show_preview_links: true


# ==========================================
# Collections
# ==========================================

collections:

  # ========================================
  # 1. 網站基本設定
  # ========================================
  - name: "site_settings"
    label: "網站基本設定"

    files:
      - label: "品牌與 YouTube 頻道"
        name: "settings"
        file: "content/settings.json"

        fields:
          - {
              label: "網站名稱",
              name: "siteTitle",
              widget: "string",
              default: "迷幻の罐罐"
            }

          - {
              label: "網站簡介",
              name: "tagline",
              widget: "string",
              required: false
            }

          - {
              label: "Logo",
              name: "logo",
              widget: "image",
              required: false
            }

          - {
              label: "YouTube 頻道網址",
              name: "channelUrl",
              widget: "string",
              default: "https://www.youtube.com/@迷幻の罐罐"
            }

          - {
              label: "頻道按鈕文字",
              name: "channelLabel",
              widget: "string",
              default: "前往頻道"
            }


  # ========================================
  # 2. YouTube 精選影片
  # ========================================
  - name: "youtube_videos"
    label: "YouTube 精選影片"

    files:
      - label: "影片清單"
        name: "videos"
        file: "content/videos.json"

        fields:
          - label: "影片"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"

            fields:
              - {
                  label: "影片標題",
                  name: "title",
                  widget: "string"
                }

              - {
                  label: "YouTube 網址",
                  name: "url",
                  widget: "string"
                }

              - {
                  label: "簡介",
                  name: "description",
                  widget: "text",
                  required: false
                }

              - {
                  label: "自訂縮圖（可留空自動抓 YouTube 縮圖）",
                  name: "thumbnail",
                  widget: "image",
                  required: false
                }

              - {
                  label: "顯示於網站",
                  name: "visible",
                  widget: "boolean",
                  default: true
                }


  # ========================================
  # 3. 其他社群／資源／遊戲
  # ========================================
  - name: "community_links"
    label: "其他社群／資源／遊戲"

    files:
      - label: "分類與連結管理"
        name: "socials"
        file: "content/socials.json"

        fields:
          - label: "分類群組（可新增、改名、排序）"
            name: "groups"
            widget: "list"
            summary: "{{fields.title}}"

            fields:
              - {
                  label: "分類名稱",
                  name: "title",
                  widget: "string"
                }

              - {
                  label: "分類說明",
                  name: "description",
                  widget: "text",
                  required: false
                }

              - {
                  label: "顯示此分類",
                  name: "visible",
                  widget: "boolean",
                  default: true
                }

              - label: "此分類的連結"
                name: "links"
                widget: "list"
                summary: "{{fields.title}}"

                fields:
                  - {
                      label: "連結標題",
                      name: "title",
                      widget: "string"
                    }

                  - {
                      label: "網址",
                      name: "url",
                      widget: "string"
                    }

                  - {
                      label: "說明",
                      name: "description",
                      widget: "text",
                      required: false
                    }

                  - {
                      label: "顯示此連結",
                      name: "visible",
                      widget: "boolean",
                      default: true
                    }


  # ========================================
  # 4. 邏輯區／限時題目
  # ========================================
  - name: "logic_questions"
    label: "邏輯區／限時題目"

    files:
      - label: "題目管理"
        name: "logic"
        file: "content/logic.json"

        fields:
          - {
              label: "區塊標題",
              name: "title",
              widget: "string",
              default: "限時題目"
            }

          - {
              label: "區塊簡介",
              name: "intro",
              widget: "string",
              required: false
            }

          - label: "題目清單"
            name: "questions"
            widget: "list"
            summary: "{{fields.title}}"

            fields:
              - {
                  label: "題目名稱",
                  name: "title",
                  widget: "string"
                }

              - {
                  label: "題目內容",
                  name: "prompt",
                  widget: "text"
                }

              - label: "題目形式"
                name: "type"
                widget: "select"
                options:
                  - {
                      label: "選擇題",
                      value: "choice"
                    }
                  - {
                      label: "填充題",
                      value: "fill"
                    }
                default: "choice"

              - label: "選項（選擇題使用）"
                name: "options"
                widget: "list"
                required: false

                field:
                  label: "選項文字"
                  name: "option"
                  widget: "string"

              - {
                  label: "正確答案（多個答案請用 | 分隔）",
                  name: "answer",
                  widget: "string"
                }

              - {
                  label: "解答說明",
                  name: "explanation",
                  widget: "text",
                  required: false
                }

              - {
                  label: "開始時間（留空表示立即開放）",
                  name: "startsAt",
                  widget: "datetime",
                  required: false,
                  time_format: "HH:mm",
                  format: "YYYY-MM-DDTHH:mm:ssZ"
                }

              - {
                  label: "截止時間（留空表示不設期限）",
                  name: "endsAt",
                  widget: "datetime",
                  required: false,
                  time_format: "HH:mm",
                  format: "YYYY-MM-DDTHH:mm:ssZ"
                }

              - {
                  label: "顯示此題目",
                  name: "visible",
                  widget: "boolean",
                  default: true
                }


  # ========================================
  # 5. 故事／簡報編輯
  # ========================================
  - name: "stories"
    label: "故事／簡報編輯"

    files:
      - label: "故事與投影片"
        name: "stories"
        file: "content/stories.json"

        fields:
          - {
              label: "區塊標題",
              name: "title",
              widget: "string",
              default: "故事"
            }

          - {
              label: "區塊簡介",
              name: "intro",
              widget: "string",
              required: false
            }

          - label: "故事清單"
            name: "stories"
            widget: "list"
            summary: "{{fields.title}}"

            fields:
              - {
                  label: "故事標題",
                  name: "title",
                  widget: "string"
                }

              - {
                  label: "副標題／系列名稱",
                  name: "subtitle",
                  widget: "string",
                  required: false
                }

              - {
                  label: "顯示此故事",
                  name: "visible",
                  widget: "boolean",
                  default: true
                }

              - label: "投影片（可新增多頁並拖曳排序）"
                name: "slides"
                widget: "list"
                summary: "{{fields.title}}"

                fields:
                  - {
                      label: "頁面標題",
                      name: "title",
                      widget: "string"
                    }

                  - {
                      label: "頁面文字",
                      name: "text",
                      widget: "text",
                      required: false
                    }

                  - {
                      label: "頁面圖片",
                      name: "image",
                      widget: "image",
                      required: false
                    }
